org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# The Gradle daemon is a long-lived JVM that survives between builds. On the
# native executor (§13.3) it therefore survives between RUNS, holding file locks
# and a stale classpath — the opposite of what a fresh clone per run is for.
# Off, at the cost of a few seconds of JVM startup.
org.gradle.daemon=false
