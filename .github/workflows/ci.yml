# Throwaway: never merged. Prints what a step on the desktop's host runner finds.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  host-path:
    runs-on: docker-host
    if: vars.LATEM == 'true'
    steps:
      - name: as shell bash
        shell: bash
        run: |
          echo "PATH=$PATH"
          echo "user=$(id -un)"
          grep -E '^(NAME|ID|ID_LIKE)=' /etc/os-release
          for t in go gcc git docker python3 cargo; do printf '%s: ' "$t"; command -v "$t" || echo none; done
          ls -l /usr/bin/go /usr/lib/go/bin/go 2>&1 || true
          pacman -Q go gcc 2>&1 || true
          grep -E ' (installed|upgraded|removed) (go|gcc) ' /var/log/pacman.log 2>&1 | tail -5 || true
          tail -3 /var/log/pacman.log 2>&1 || true
          ls -ld /usr/local/go "$HOME/go" "$HOME/sdk" 2>&1 || true
      - name: as a login shell
        shell: bash
        run: |
          bash -lc 'echo "PATH=$PATH"; command -v go || echo "go: none"'
